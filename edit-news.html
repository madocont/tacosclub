<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニュース編集 - タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+HarunoUmi:wght@400;500;700&family=Montserrat:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: #333;
      background: #f5f5f5;
    }

    .edit-header {
      background: #fa5514;
      color: #fff;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .edit-header h1 {
      font-family: 'Kaisei HarunoUmi', serif;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .edit-header a {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .edit-header a:hover { opacity: 1; }

    .container {
      max-width: 800px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .actions-bar h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #333;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #fa5514;
      color: #fff;
    }

    .btn-primary:hover { background: #e14710; }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover { background: #ccc; }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-edit-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 12px;
    }

    .field-group input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .field-group input:focus {
      border-color: #fa5514;
      outline: none;
    }

    .field-group label {
      font-size: 0.75rem;
      color: #999;
      font-weight: 500;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      background: #f5f5f5;
      color: #999;
    }

    .btn-icon:hover {
      background: #e74c3c;
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .btn-gear {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      padding: 4px;
    }
    .btn-gear:hover { opacity: 1; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 400px;
      max-width: 90vw;
    }
    .modal h3 {
      font-size: 1rem;
      margin-bottom: 16px;
      color: #333;
    }
    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .modal input:focus { border-color: #fa5514; outline: none; }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    @media (max-width: 600px) {
      .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="edit-header">
    <h1>ニュース編集</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="index.html">← サイトに戻る</a>
      <button class="btn-gear" onclick="showTokenModal()" title="GitHub設定">⚙</button>
    </div>
  </div>

  <div class="modal-overlay" id="token-modal">
    <div class="modal">
      <h3>GitHub Personal Access Token</h3>
      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeTokenModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveToken()">保存</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="actions-bar">
      <h2>News</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="addNews()">+ 追加</button>
        <button class="btn btn-primary" onclick="saveData()">保存する</button>
      </div>
    </div>
    <div class="news-list" id="news-list"></div>
  </div>

  <div class="toast" id="toast">保存しました</div>

  <script>
    let data = { members: [], news: [] };

    async function loadData() {
      const res = await fetch('data.json?t=' + Date.now());
      data = await res.json();
      renderNews();
    }

    function renderNews() {
      const list = document.getElementById('news-list');
      list.innerHTML = '';
      data.news.forEach((n, i) => {
        list.innerHTML += `
          <div class="news-edit-card">
            <div class="field-group">
              <div class="field-row">
                <div>
                  <label>日付</label>
                  <input type="text" value="${n.date}" placeholder="例: 3月8日（土）"
                         onchange="updateNews(${i}, 'date', this.value)">
                </div>
                <div>
                  <label>イベント内容</label>
                  <input type="text" value="${n.event}" placeholder="イベント名・内容"
                         onchange="updateNews(${i}, 'event', this.value)">
                </div>
              </div>
            </div>
            <button class="btn-icon" onclick="deleteNews(${i})" title="削除">✕</button>
          </div>`;
      });
    }

    function updateNews(index, field, value) {
      data.news[index][field] = value;
    }

    function addNews() {
      const newId = data.news.length > 0
        ? Math.max(...data.news.map(n => n.id)) + 1
        : 1;
      data.news.push({
        id: newId,
        date: '',
        event: ''
      });
      renderNews();
    }

    function deleteNews(index) {
      if (confirm(`このニュースを削除しますか？`)) {
        data.news.splice(index, 1);
        renderNews();
      }
    }

    const REPO_OWNER = 'madocont';
    const REPO_NAME = 'tacosclub';
    const FILE_PATH = 'data.json';

    function showTokenModal() {
      const modal = document.getElementById('token-modal');
      const input = document.getElementById('token-input');
      input.value = localStorage.getItem('github-token') || '';
      modal.classList.add('show');
    }

    function closeTokenModal() {
      document.getElementById('token-modal').classList.remove('show');
    }

    function saveToken() {
      const token = document.getElementById('token-input').value.trim();
      if (token) {
        localStorage.setItem('github-token', token);
        closeTokenModal();
        showToast('トークンを保存しました');
      }
    }

    async function saveData() {
      const token = localStorage.getItem('github-token');
      if (!token) {
        showTokenModal();
        return;
      }

      const json = JSON.stringify(data, null, 2);
      const btn = document.querySelector('.btn-primary');
      btn.textContent = '保存中...';
      btn.disabled = true;

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (getRes.status === 401) {
          localStorage.removeItem('github-token');
          showToast('トークンが無効です。再設定してください。');
          showTokenModal();
          return;
        }

        const fileData = await getRes.json();
        const sha = fileData.sha;

        const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: 'Update data.json',
            content: btoa(unescape(encodeURIComponent(json))),
            sha: sha,
          })
        });

        if (putRes.ok) {
          showToast('保存しました！まもなくサイトに反映されます。');
        } else {
          const err = await putRes.json();
          showToast('保存失敗: ' + (err.message || 'エラーが発生しました'));
        }
      } catch (e) {
        showToast('通信エラー: ' + e.message);
      } finally {
        btn.textContent = '保存する';
        btn.disabled = false;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    loadData();
  </script>
</body>
</html>
