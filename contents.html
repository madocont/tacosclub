<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contents - タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Montserrat:wght@400;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #efe4cc;
      --terra: #cf4f2b;
      --red:   #b1302b;
      --sage:  #6d7b50;
      --navy:  #23303b;
      --gold:  #d7a95a;
      --brown: #2b2119;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--brown);
      background: var(--cream);
      min-height: 100vh;
    }

    /* Lock Screen */
    .lock-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 24px;
    }

    .lock-screen.hidden { display: none; }

    .lock-title {
      font-family: 'Zen Antique', serif;
      font-size: 2rem;
      color: var(--terra);
    }

    .lock-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .lock-form input {
      width: 240px;
      padding: 12px 16px;
      border: 2px solid rgba(43, 33, 25, 0.2);
      border-radius: 10px;
      background: #fff8ec;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.1em;
      color: var(--brown);
      transition: border-color 0.2s;
    }

    .lock-form input:focus {
      border-color: var(--terra);
      outline: none;
    }

    .lock-form input.error {
      border-color: var(--red);
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .lock-form button {
      padding: 10px 40px;
      background: var(--terra);
      color: var(--cream);
      border: none;
      border-radius: 50px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lock-form button:hover { background: var(--red); }

    .lock-hint {
      font-size: 0.8rem;
      color: rgba(43, 33, 25, 0.5);
    }

    .lock-back {
      font-size: 0.85rem;
      color: var(--terra);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .lock-back:hover { opacity: 0.7; }

    /* Contents Page */
    .contents-page { display: none; }
    .contents-page.visible { display: block; }

    .contents-header {
      background: var(--sage);
      color: var(--cream);
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .contents-header h1 {
      font-family: 'Zen Antique', serif;
      font-weight: 400;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }

    .contents-header a {
      color: var(--cream);
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .contents-header a:hover { opacity: 1; }

    .contents-body {
      max-width: 940px;
      margin: 0 auto;
      padding: 52px 20px;
    }

    .contents-body h2 {
      font-family: 'Zen Antique', serif;
      font-weight: 400;
      font-size: 2rem;
      color: var(--brown);
      margin-bottom: 36px;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .contents-body h2::after {
      content: '';
      display: block;
      width: 64px;
      height: 3px;
      background: var(--terra);
      margin: 14px auto 0;
      border-radius: 2px;
    }

    /* Category mosaic */
    .category-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .category-btn {
      position: relative;
      overflow: hidden;
      min-height: 160px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-decoration: none;
      transition: transform 0.18s, filter 0.18s;
    }

    .category-btn:hover { transform: translateY(-3px); filter: brightness(1.06); }

    .category-btn .cat-name {
      position: relative;
      z-index: 1;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .category-btn .cat-kanji {
      position: absolute;
      right: -6px;
      bottom: -20px;
      font-family: 'Zen Antique', serif;
      font-size: 6.5rem;
      line-height: 1;
      opacity: 0.16;
      pointer-events: none;
    }

    /* mosaic spans */
    .category-btn:nth-child(3n+1) { grid-column: span 2; }

    /* rotating retro colors */
    .category-btn:nth-child(6n+1) { background: var(--terra); color: var(--cream); }
    .category-btn:nth-child(6n+2) { background: var(--sage); color: var(--cream); }
    .category-btn:nth-child(6n+3) { background: var(--navy); color: var(--cream); }
    .category-btn:nth-child(6n+4) { background: var(--gold); color: var(--brown); }
    .category-btn:nth-child(6n+5) { background: var(--red); color: var(--cream); }
    .category-btn:nth-child(6n+6) { background: var(--brown); color: var(--gold); }

    /* Category detail */
    .category-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .category-heading h3 {
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--brown);
      padding-bottom: 8px;
      border-bottom: 3px solid var(--terra);
    }

    .category-back {
      color: var(--terra);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .category-back:hover { opacity: 0.7; }

    .category-empty {
      font-size: 0.9rem;
      color: rgba(43, 33, 25, 0.5);
      text-align: center;
      padding: 40px 0;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .content-card {
      background: #fff8ec;
      border-radius: 16px;
      padding: 24px;
      border-top: 6px solid var(--terra);
      box-shadow: 0 4px 16px rgba(43, 33, 25, 0.08);
    }

    .content-card:nth-child(6n+1) { border-top-color: var(--terra); }
    .content-card:nth-child(6n+2) { border-top-color: var(--sage); }
    .content-card:nth-child(6n+3) { border-top-color: var(--navy); }
    .content-card:nth-child(6n+4) { border-top-color: var(--gold); }
    .content-card:nth-child(6n+5) { border-top-color: var(--red); }
    .content-card:nth-child(6n+6) { border-top-color: var(--brown); }

    .content-card h3 {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.5;
    }

    .content-card h3 a {
      color: var(--brown);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .content-card h3 a:hover { opacity: 0.6; }

    /* Taco type search (種類) */
    .taco-search {
      background: #fff8ec;
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: 0 4px 16px rgba(43, 33, 25, 0.08);
      margin-bottom: 28px;
    }

    .taco-search input[type="search"] {
      width: 100%;
      padding: 13px 18px;
      border: 2px solid rgba(43, 33, 25, 0.25);
      border-radius: 12px;
      background: #fff;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 1rem;
      color: var(--brown);
      transition: border-color 0.2s;
    }

    .taco-search input[type="search"]:focus {
      border-color: var(--terra);
      outline: none;
    }

    .filter-group { margin-top: 18px; }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(43, 33, 25, 0.6);
      margin-bottom: 8px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 8px 18px;
      border-radius: 50px;
      border: 2px solid var(--brown);
      background: transparent;
      color: var(--brown);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .chip:hover { transform: translateY(-1px); }

    .chip.on-meat { background: var(--terra); border-color: var(--terra); color: var(--cream); }
    .chip.on-method { background: var(--sage); border-color: var(--sage); color: var(--cream); }

    .taco-count {
      margin: 20px 0 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(43, 33, 25, 0.6);
    }

    .taco-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .taco-card {
      background: #fff8ec;
      border-radius: 16px;
      padding: 22px;
      border-top: 6px solid var(--terra);
      box-shadow: 0 4px 16px rgba(43, 33, 25, 0.08);
    }

    .taco-card:nth-child(6n+2) { border-top-color: var(--sage); }
    .taco-card:nth-child(6n+3) { border-top-color: var(--navy); }
    .taco-card:nth-child(6n+4) { border-top-color: var(--gold); }
    .taco-card:nth-child(6n+5) { border-top-color: var(--red); }
    .taco-card:nth-child(6n+6) { border-top-color: var(--brown); }

    .taco-card h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 8px;
    }

    .taco-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .taco-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
      color: var(--cream);
      background: var(--terra);
    }

    .taco-tag.tag-method { background: var(--sage); }

    .taco-card p {
      font-size: 0.85rem;
      line-height: 1.7;
      color: rgba(43, 33, 25, 0.85);
    }

    .articles-heading {
      margin: 44px 0 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--brown);
      padding-bottom: 6px;
      border-bottom: 2px solid rgba(43, 33, 25, 0.2);
    }

    footer {
      background: var(--red);
      color: var(--cream);
      text-align: center;
      padding: 32px 20px;
      margin-top: 40px;
    }

    footer p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .category-buttons { grid-template-columns: 1fr; }
      .category-btn:nth-child(3n+1) { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <!-- Lock Screen -->
  <div class="lock-screen" id="lock-screen">
    <div class="lock-title">Contents</div>
    <div class="lock-form">
      <input type="password" id="passcode-input" placeholder="passcode" autocomplete="off">
      <button onclick="unlock()">Enter</button>
    </div>
    <span class="lock-hint">Members only</span>
    <a href="index.html" class="lock-back">← Back</a>
  </div>

  <!-- Contents Page -->
  <div class="contents-page" id="contents-page">
    <div class="contents-header">
      <h1>Contents</h1>
      <a href="index.html">← Back</a>
    </div>

    <div class="contents-body">
      <h2>Members Only</h2>
      <div id="categories-container"></div>
    </div>

    <footer>
      <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const PASSCODE = 'taqueria000';
    const EDIT_CODE = 'hensyuu';

    // Check if already authenticated
    if (sessionStorage.getItem('tacos-auth') === 'true') {
      showContents();
    }

    // Enter key support
    document.getElementById('passcode-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });

    function unlock() {
      const input = document.getElementById('passcode-input');
      if (input.value === EDIT_CODE) {
        location.href = 'https://map1taa.github.io/tacosclub-admin/';
      } else if (input.value === PASSCODE) {
        sessionStorage.setItem('tacos-auth', 'true');
        showContents();
      } else {
        input.classList.add('error');
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 400);
      }
    }

    function showContents() {
      document.getElementById('lock-screen').classList.add('hidden');
      document.getElementById('contents-page').classList.add('visible');
      loadContents();
    }

    const CATEGORIES = ['サルサ', 'トルティージャ', '種類', 'タコスパーティー'];

    async function loadContents() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();
      const contents = data.contents || [];
      const container = document.getElementById('categories-container');
      const params = new URLSearchParams(location.search);
      const selected = params.get('cat');

      if (selected && CATEGORIES.includes(selected)) {
        const items = contents.filter(c => c.category === selected);
        const cards = items.length
          ? `<div class="content-grid">${items.map(c => `
              <div class="content-card">
                <h3><a href="content-detail.html?id=${c.id}">${c.title}</a></h3>
              </div>`).join('')}</div>`
          : `<div class="category-empty">記事はまだありません</div>`;
        container.innerHTML = `
          <div class="category-heading">
            <h3>${selected}</h3>
            <a href="contents.html" class="category-back">← カテゴリ一覧</a>
          </div>
          ${cards}`;
      } else {
        // Members content home: taco search + category browse
        container.innerHTML = `
          <div class="taco-search">
            <input type="search" id="taco-q" placeholder="タコスの名前や食材で検索…">
            <div class="filter-group">
              <div class="filter-label">肉・具材で絞る</div>
              <div class="chips" id="meat-chips"></div>
            </div>
            <div class="filter-group">
              <div class="filter-label">調理法で絞る</div>
              <div class="chips" id="method-chips"></div>
            </div>
          </div>
          <div class="taco-count" id="taco-count"></div>
          <div class="taco-grid" id="taco-grid"></div>
          <div id="cat-browse">
            <div class="articles-heading">カテゴリから探す</div>
            <div class="category-buttons">${
              CATEGORIES.map(cat =>
                `<a class="category-btn" href="contents.html?cat=${encodeURIComponent(cat)}">
                   <span class="cat-name">${cat}</span>
                   <span class="cat-kanji">${cat.charAt(0)}</span>
                 </a>`
              ).join('')
            }</div>
          </div>`;
        initTacoSearch(data.tacoTypes || []);
      }
    }

    // ---- Taco type search (種類) ----
    function initTacoSearch(types) {
      const meats = [...new Set(types.map(t => t.meat))];
      const methods = [...new Set(types.flatMap(t => t.methods))];
      const state = { q: '', meats: new Set(), methods: new Set() };

      const meatWrap = document.getElementById('meat-chips');
      const methodWrap = document.getElementById('method-chips');

      meatWrap.innerHTML = meats.map(m =>
        `<button class="chip" data-kind="meat" data-val="${m}">${m}</button>`).join('');
      methodWrap.innerHTML = methods.map(m =>
        `<button class="chip" data-kind="method" data-val="${m}">${m}</button>`).join('');

      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const kind = chip.dataset.kind;
          const val = chip.dataset.val;
          const set = kind === 'meat' ? state.meats : state.methods;
          const cls = kind === 'meat' ? 'on-meat' : 'on-method';
          if (set.has(val)) { set.delete(val); chip.classList.remove(cls); }
          else { set.add(val); chip.classList.add(cls); }
          render();
        });
      });

      document.getElementById('taco-q').addEventListener('input', e => {
        state.q = e.target.value.trim().toLowerCase();
        render();
      });

      function render() {
        const active = state.q || state.meats.size || state.methods.size;
        const browse = document.getElementById('cat-browse');
        const grid = document.getElementById('taco-grid');
        const count = document.getElementById('taco-count');

        // Show category browse by default; show taco results when searching
        if (browse) browse.style.display = active ? 'none' : '';
        grid.style.display = active ? '' : 'none';
        count.style.display = active ? '' : 'none';

        if (!active) { grid.innerHTML = ''; count.textContent = ''; return; }

        const hits = types.filter(t => {
          if (state.meats.size && !state.meats.has(t.meat)) return false;
          if (state.methods.size && ![...state.methods].every(m => t.methods.includes(m))) return false;
          if (state.q) {
            const hay = `${t.name} ${t.meat} ${t.methods.join(' ')} ${t.desc}`.toLowerCase();
            if (!hay.includes(state.q)) return false;
          }
          return true;
        });

        count.textContent =
          hits.length ? `${hits.length}種類のタコス` : '該当なし — 条件をゆるめてみてください';

        grid.innerHTML = hits.map(t => `
          <div class="taco-card">
            <h4>${t.name}</h4>
            <div class="taco-tags">
              <span class="taco-tag">${t.meat}</span>
              ${t.methods.map(m => `<span class="taco-tag tag-method">${m}</span>`).join('')}
            </div>
            <p>${t.desc}</p>
          </div>`).join('');
      }

      render();
    }
  </script>
</body>
</html>
