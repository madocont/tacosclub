<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコスの種類 - タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #efe4cc;
      --terra: #cf4f2b;
      --sage:  #6d7b50;
      --navy:  #23303b;
      --brown: #2b2119;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--brown);
      background: var(--terra);
      min-height: 100vh;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .top-back {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }

    .top-back:hover { opacity: 1; }

    .detail-card {
      background: #fff;
      border-radius: 28px;
      padding: 44px 40px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    }

    .detail-title {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: #222;
      line-height: 1.4;
    }

    .detail-region {
      text-align: center;
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(43, 33, 25, 0.55);
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 22px 0 26px;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 50px;
      color: var(--cream);
      background: var(--terra);
    }

    .tag.tag-method { background: var(--sage); }
    .tag.tag-tortilla { background: var(--navy); }

    .detail-content {
      font-size: 1rem;
      line-height: 2;
      color: #333;
      white-space: pre-wrap;
      padding-top: 24px;
      border-top: 1px solid rgba(43, 33, 25, 0.15);
    }

    .detail-back-wrap {
      text-align: center;
      margin-top: 40px;
    }

    .detail-back-btn {
      display: inline-block;
      padding: 13px 40px;
      background: var(--brown);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .detail-back-btn:hover { opacity: 0.85; }

    @media (max-width: 600px) {
      .detail-card { padding: 32px 24px; border-radius: 22px; }
      .detail-title { font-size: 1.45rem; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <a href="contents.html" class="top-back">← Back</a>
    <div class="detail-card" id="detail-body">
      <p>読み込み中...</p>
    </div>
  </div>

  <script>
    const asList = v => Array.isArray(v) ? v : (v ? [v] : []);

    async function loadTaco() {
      const id = Number(new URLSearchParams(location.search).get('id'));

      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const item = (data.tacoTypes || []).find(t => t.id === id);
      const body = document.getElementById('detail-body');

      if (!item) {
        body.innerHTML = '<p>このタコスは見つかりませんでした。</p>';
        return;
      }

      document.title = `${item.name} - タコス倶楽部`;

      body.innerHTML = `
        <h2 class="detail-title">${item.name}</h2>
        ${item.region ? `<div class="detail-region">${item.region}</div>` : ''}
        <div class="detail-tags">
          ${asList(item.meat).map(m => `<span class="tag">${m}</span>`).join('')}
          ${asList(item.methods).map(m => `<span class="tag tag-method">${m}</span>`).join('')}
          ${asList(item.tortilla).map(v => `<span class="tag tag-tortilla">${v}</span>`).join('')}
        </div>
        <div class="detail-content">${item.desc || ''}</div>
        <div class="detail-back-wrap">
          <a href="contents.html" class="detail-back-btn">← 一覧に戻る</a>
        </div>
      `;
    }

    loadTaco();
  </script>
</body>
</html>
