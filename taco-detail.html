<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコスの種類 - タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #efe4cc;
      --orange: #e8792f;
      --terra: #cf4f2b;
      --sage:  #6d7b50;
      --navy:  #23303b;
      --brown: #2b2119;
      --ink:   #111;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--ink);
      background: var(--orange);
      min-height: 100vh;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 26px 20px 56px;
    }

    .top-back {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0.92;
      margin-bottom: 18px;
      transition: opacity 0.2s;
    }

    .top-back:hover { opacity: 1; }

    .card {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 32px;
      padding: 42px 44px;
    }

    /* name + button + feature, with the photo on the right */
    .head {
      display: grid;
      grid-template-columns: 1fr 210px;
      gap: 28px;
      align-items: start;
    }

    .taco-name {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .feature {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .region {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(17, 17, 17, 0.5);
      margin-bottom: 14px;
    }

    /* the original tag buttons */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 50px;
      color: var(--cream);
      background: var(--terra);
    }

    .tag.tag-method { background: var(--sage); }
    .tag.tag-tortilla { background: var(--navy); }

    .photo {
      border-radius: 6px;
      overflow: hidden;
      background: #f2ede4;
      aspect-ratio: 4 / 3;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 材料 / 作り方 */
    .recipe {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 36px;
    }

    .recipe h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .recipe .body {
      font-size: 0.92rem;
      line-height: 2;
      white-space: pre-wrap;
    }

    .recipe .empty {
      font-size: 0.85rem;
      color: rgba(17, 17, 17, 0.4);
    }

    .back-wrap {
      text-align: center;
      margin-top: 40px;
    }

    .back-btn {
      display: inline-block;
      padding: 13px 40px;
      background: var(--ink);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .back-btn:hover { opacity: 0.85; }

    @media (max-width: 640px) {
      .card { padding: 30px 24px; border-radius: 24px; }
      .head { grid-template-columns: 1fr; }
      .taco-name { font-size: 1.45rem; }
      .recipe { grid-template-columns: 1fr; gap: 26px; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <a href="contents.html" class="top-back">← Back</a>
    <div class="card" id="detail-body">
      <p>読み込み中...</p>
    </div>
  </div>

  <script>
    const asList = v => Array.isArray(v) ? v : (v ? [v] : []);

    async function loadTaco() {
      const id = Number(new URLSearchParams(location.search).get('id'));

      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const t = (data.tacoTypes || []).find(x => x.id === id);
      const body = document.getElementById('detail-body');

      if (!t) {
        body.innerHTML = '<p>このタコスは見つかりませんでした。</p>';
        return;
      }

      document.title = `${t.name} - タコス倶楽部`;

      const tags = `
        ${asList(t.meat).map(m => `<span class="tag">${m}</span>`).join('')}
        ${asList(t.methods).map(m => `<span class="tag tag-method">${m}</span>`).join('')}
        ${asList(t.tortilla).map(v => `<span class="tag tag-tortilla">${v}</span>`).join('')}`;

      const photo = t.image
        ? `<div class="photo"><img src="${t.image}" alt="${t.name}"></div>`
        : '';

      body.innerHTML = `
        <div class="head">
          <div>
            <h1 class="taco-name">${t.name}</h1>
            ${t.region ? `<div class="region">${t.region}</div>` : ''}
            <div class="tags">${tags}</div>
            <p class="feature">${t.desc || ''}</p>
          </div>
          ${photo}
        </div>
        <div class="recipe">
          <div>
            <h2>材料</h2>
            <div class="${t.ingredients ? 'body' : 'empty'}">${t.ingredients || '準備中'}</div>
          </div>
          <div>
            <h2>作り方</h2>
            <div class="${t.steps ? 'body' : 'empty'}">${t.steps || '準備中'}</div>
          </div>
        </div>
        <div class="back-wrap">
          <a href="contents.html" class="back-btn">← 一覧に戻る</a>
        </div>
      `;
    }

    loadTaco();
  </script>
</body>
</html>
