<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンテンツ編集 - タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+HarunoUmi:wght@400;500;700&family=Montserrat:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: #333;
      background: #f5f5f5;
    }

    .edit-header {
      background: #fd6405;
      color: #fff;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .edit-header h1 {
      font-family: 'Kaisei HarunoUmi', serif;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .edit-header a {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .edit-header a:hover { opacity: 1; }

    .container {
      max-width: 800px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .actions-bar h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #333;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: #fd6405; color: #fff; }
    .btn-primary:hover { background: #e55a04; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-secondary:hover { background: #ccc; }

    .contents-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .content-edit-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-group select,
    .field-group input,
    .field-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .field-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .field-group textarea.body-textarea {
      min-height: 160px;
    }

    .field-group select:focus,
    .field-group input:focus,
    .field-group textarea:focus {
      border-color: #fd6405;
      outline: none;
    }

    .field-group label {
      font-size: 0.75rem;
      color: #999;
      font-weight: 500;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      background: #f5f5f5;
      color: #999;
    }

    .btn-icon:hover {
      background: #e74c3c;
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .btn-gear {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
      padding: 4px;
    }
    .btn-gear:hover { opacity: 1; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 400px;
      max-width: 90vw;
    }
    .modal h3 {
      font-size: 1rem;
      margin-bottom: 16px;
      color: #333;
    }
    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .modal input:focus { border-color: #fd6405; outline: none; }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

  </style>
</head>
<body>

  <div class="edit-header">
    <h1 id="page-title">コンテンツ編集</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <a id="back-link" href="contents.html">← 戻る</a>
      <button class="btn-gear" onclick="showTokenModal()" title="GitHub設定">⚙</button>
    </div>
  </div>

  <div class="modal-overlay" id="token-modal">
    <div class="modal">
      <h3>GitHub Personal Access Token</h3>
      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeTokenModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveToken()">保存</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="actions-bar">
      <h2>Contents</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="addContent()">+ 追加</button>
        <button class="btn btn-primary" onclick="saveData()">保存する</button>
      </div>
    </div>
    <div class="contents-list" id="contents-list"></div>
  </div>

  <div class="toast" id="toast">保存しました</div>

  <script>
    let data = { members: [], news: [], contents: [] };

    async function loadData() {
      const res = await fetch('data.json?t=' + Date.now());
      data = await res.json();
      if (!data.contents) data.contents = [];
      renderContents();
    }

    const CATEGORIES = ['サルサ', 'トルティージャ', '種類', 'タコスパーティー'];
    const CURRENT_CAT = (() => {
      const c = new URLSearchParams(location.search).get('cat');
      return CATEGORIES.includes(c) ? c : null;
    })();

    if (CURRENT_CAT) {
      document.getElementById('page-title').textContent = `${CURRENT_CAT} 編集`;
      document.getElementById('back-link').href = `contents.html?cat=${encodeURIComponent(CURRENT_CAT)}`;
    }

    function renderContents() {
      const list = document.getElementById('contents-list');
      list.innerHTML = '';
      const visible = CURRENT_CAT
        ? data.contents.map((c, i) => ({ c, i })).filter(x => x.c.category === CURRENT_CAT)
        : data.contents.map((c, i) => ({ c, i }));
      visible.forEach(({ c, i }) => {
        const categoryField = CURRENT_CAT ? '' : (() => {
          const opts = CATEGORIES.map(cat =>
            `<option value="${cat}"${c.category === cat ? ' selected' : ''}>${cat}</option>`
          ).join('');
          return `
              <label>カテゴリ</label>
              <select onchange="updateContent(${i}, 'category', this.value)">
                <option value=""${!c.category ? ' selected' : ''}>（未分類）</option>
                ${opts}
              </select>`;
        })();
        list.innerHTML += `
          <div class="content-edit-card">
            <div class="field-group">
              ${categoryField}
              <label>タイトル</label>
              <input type="text" value="${c.title}" placeholder="コンテンツタイトル"
                     onchange="updateContent(${i}, 'title', this.value)">
              <label>本文</label>
              <textarea class="body-textarea" onchange="updateContent(${i}, 'body', this.value)"
                        placeholder="記事の本文">${c.body || ''}</textarea>
            </div>
            <button class="btn-icon" onclick="deleteContent(${i})" title="削除">✕</button>
          </div>`;
      });
    }

    function updateContent(index, field, value) {
      data.contents[index][field] = value;
    }

    function addContent() {
      const newId = data.contents.length > 0
        ? Math.max(...data.contents.map(c => c.id)) + 1
        : 1;
      data.contents.push({
        id: newId,
        category: CURRENT_CAT || 'サルサ',
        title: '',
        body: ''
      });
      renderContents();
    }

    function deleteContent(index) {
      if (confirm(`このコンテンツを削除しますか？`)) {
        data.contents.splice(index, 1);
        renderContents();
      }
    }

    const REPO_OWNER = 'madocont';
    const REPO_NAME = 'tacosclub';
    const FILE_PATH = 'data.json';

    function showTokenModal() {
      const modal = document.getElementById('token-modal');
      const input = document.getElementById('token-input');
      input.value = localStorage.getItem('github-token') || '';
      modal.classList.add('show');
    }

    function closeTokenModal() {
      document.getElementById('token-modal').classList.remove('show');
    }

    function saveToken() {
      const token = document.getElementById('token-input').value.trim();
      if (token) {
        localStorage.setItem('github-token', token);
        closeTokenModal();
        showToast('トークンを保存しました');
      }
    }

    async function saveData() {
      const token = localStorage.getItem('github-token');
      if (!token) {
        showTokenModal();
        return;
      }

      const json = JSON.stringify(data, null, 2);
      const btn = document.querySelector('.btn-primary');
      btn.textContent = '保存中...';
      btn.disabled = true;

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (getRes.status === 401) {
          localStorage.removeItem('github-token');
          showToast('トークンが無効です。再設定してください。');
          showTokenModal();
          return;
        }

        const fileData = await getRes.json();
        const sha = fileData.sha;

        const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: 'Update data.json',
            content: btoa(unescape(encodeURIComponent(json))),
            sha: sha,
          })
        });

        if (putRes.ok) {
          showToast('保存しました！まもなくサイトに反映されます。');
        } else {
          const err = await putRes.json();
          showToast('保存失敗: ' + (err.message || 'エラーが発生しました'));
        }
      } catch (e) {
        showToast('通信エラー: ' + e.message);
      } finally {
        btn.textContent = '保存する';
        btn.disabled = false;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    loadData();
  </script>
</body>
</html>
