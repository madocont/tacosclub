<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #40210f;
      background: #fdf3e7;
    }

    /* Header */
    header {
      text-align: center;
      padding: 72px 20px 28px;
    }

    header h1 {
      font-family: 'Yellowtail', cursive;
      font-size: 5rem;
      font-weight: 400;
      line-height: 1.1;
      color: transparent;
      -webkit-text-stroke: 2px #fa5514;
      letter-spacing: 0.02em;
    }

    header p {
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #40210f;
      text-transform: uppercase;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 20px;
      background: #fdf3e7;
      border-bottom: 1.5px solid #40210f22;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: #40210f;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #fa5514;
    }

    /* Section cards */
    main {
      max-width: 960px;
      margin: 24px auto 64px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .sec-card {
      border: 1.5px solid #40210f;
      border-radius: 32px;
      padding: 32px;
      box-shadow: 0 2px 0 #40210f22;
    }

    .sec-card.tint-1 { background: #ffd9ac; }
    .sec-card.tint-2 { background: #ffe9c9; }
    .sec-card.tint-3 { background: #ff9d5c; }
    .sec-card.tint-4 { background: #fff3cd; }

    .sec-head {
      min-width: 0;
    }

    .sec-title-area {
      min-width: 0;
    }

    .sec-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .sec-card h2 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .sec-desc {
      font-size: 0.92rem;
      line-height: 1.9;
    }

    .sec-body {
      margin-top: 28px;
    }

    /* Members */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px 28px;
    }

    .member-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .member-info {
      min-width: 0;
    }

    .member-number {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 2px;
    }

    .member-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .member-card p {
      font-size: 0.8rem;
      line-height: 1.7;
      opacity: 0.75;
    }

    .contents-link {
      text-align: center;
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .contents-link a {
      display: inline-block;
      background: #fa5514;
      color: #fff;
      text-decoration: none;
      border: 1.5px solid #40210f;
      padding: 16px 52px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.5;
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }

    .contents-link a:hover {
      background: #e14710;
      transform: translateY(-2px);
    }

    .contents-link a.btn-outline {
      background: #fff;
      color: #fa5514;
    }

    .contents-link a.btn-outline:hover {
      background: #ffe9c9;
    }

    /* News */
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #40210f33;
    }

    .schedule-item:last-child {
      border-bottom: none;
    }

    .schedule-item .date {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 110px;
    }

    .schedule-item .event {
      font-size: 0.92rem;
    }

    /* Footer */
    footer {
      background: #fa5514;
      color: #fff;
      text-align: center;
      padding: 32px 20px;
    }

    footer p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .member-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      header { padding: 48px 16px 20px; }
      header h1 { font-size: 3.2rem; -webkit-text-stroke-width: 1.5px; }

      nav { gap: 16px; flex-wrap: wrap; }

      .sec-card { padding: 22px; border-radius: 24px; }

      .sec-card h2 { font-size: 1.8rem; }

      .member-grid { grid-template-columns: repeat(2, 1fr); }

      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tacos Club</h1>
    <p>タコス倶楽部</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#members">Member</a>
    <a href="contents.html">Contents</a>
    <a href="#news">News</a>
  </nav>

  <main>
    <section id="about" class="sec-card tint-1">
      <div class="sec-head">
        <div class="sec-title-area">
          <span class="sec-label">Section 1</span>
          <h2>About</h2>
          <p class="sec-desc">
            タコス好きによるタコス好きのためのゆるコミュニティ。<br>
            タコスに興味ある人も、最近気になっちゃってる人も、<br>
            本場のタコスを楽しみましょ！
          </p>
        </div>
      </div>
    </section>

    <section id="members" class="sec-card tint-2">
      <div class="sec-head">
        <div class="sec-title-area">
          <span class="sec-label">Section 2</span>
          <h2>Member</h2>
          <p class="sec-desc">タコス倶楽部の愉快なメンバーたち。</p>
        </div>
      </div>
      <div class="sec-body">
        <div class="member-grid" id="member-grid"></div>
        <div class="contents-link">
          <a href="https://tacosclub.stores.jp/" target="_blank" rel="noopener">入会</a>
          <a href="contents.html" class="btn-outline">Members Only</a>
        </div>
      </div>
    </section>

    <section id="news" class="sec-card tint-3">
      <div class="sec-head">
        <div class="sec-title-area">
          <span class="sec-label">Section 3</span>
          <h2>News</h2>
          <div id="news-list"></div>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
  </footer>

  <script>
    async function loadAndRender() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const memberGrid = document.getElementById('member-grid');
      memberGrid.innerHTML = '';
      data.members.sort((a, b) => {
        const numA = parseInt(a.number || '999', 10);
        const numB = parseInt(b.number || '999', 10);
        return numA - numB;
      });
      data.members.forEach((m, i) => {
        const num = m.number || String(i + 1).padStart(2, '0');
        memberGrid.innerHTML += `
          <div class="member-card">
            <div class="member-info">
              <div class="member-number">No.${num}</div>
              <h3>${m.name}</h3>
              <p>${m.bio}</p>
            </div>
          </div>`;
      });

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = '';
      data.news.forEach(n => {
        newsList.innerHTML += `
          <div class="schedule-item">
            <span class="date">${n.date}</span>
            <span class="event">${n.event}</span>
          </div>`;
      });

    }
    loadAndRender();
  </script>
</body>
</html>
