<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #efe4cc;
      --terra: #cf4f2b;
      --red:   #b1302b;
      --sage:  #6d7b50;
      --navy:  #23303b;
      --gold:  #d7a95a;
      --brown: #2b2119;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #fff;
      background: #14100c;
    }

    /* Fixed photo background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url('hero.jpg') center / cover no-repeat, #14100c;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    /* Hero: full-screen white logo */
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero-logo img {
      width: min(520px, 88vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.5));
    }

    /* Content mosaic */
    main {
      max-width: 1040px;
      margin: 18px auto 64px;
      padding: 0 16px;
    }

    .mosaic {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "about about members"
        "news  contents contents"
        "member member member";
      gap: 14px;
    }

    .blk {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 36px;
      text-decoration: none;
      transition: transform 0.2s, filter 0.2s;
    }

    a.blk:hover { transform: translateY(-3px); filter: brightness(1.06); }

    .blk .kanji {
      position: absolute;
      right: -8px;
      bottom: -22px;
      font-family: 'Zen Antique', serif;
      font-size: 8.5rem;
      line-height: 1;
      opacity: 0.12;
      pointer-events: none;
      user-select: none;
    }

    .blk h2 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .tag {
      display: inline-block;
      font-family: 'Zen Antique', serif;
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      opacity: 0.75;
      margin-bottom: 12px;
    }

    /* About */
    .blk.about {
      grid-area: about;
      background: var(--sage);
      color: var(--cream);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .blk.about .sec-desc {
      color: var(--cream);
      font-size: 0.95rem;
      line-height: 2;
      margin-top: 12px;
    }

    /* Members only (join → STORES) */
    .blk.members {
      grid-area: members;
      background: var(--terra);
      color: var(--cream);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .blk.members .jb-main {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .blk.members .jb-sub {
      margin-top: 8px;
      font-size: 0.8rem;
      opacity: 0.85;
    }

    /* News */
    .blk.news {
      grid-area: news;
      background: var(--gold);
      color: var(--brown);
    }

    .blk.news h2 { margin-bottom: 16px; }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(43, 33, 25, 0.22);
    }

    .schedule-item:last-child { border-bottom: none; }

    .schedule-item .date {
      font-weight: 800;
      font-size: 0.9rem;
      min-width: 92px;
      color: var(--brown);
    }

    .schedule-item .event {
      font-size: 0.9rem;
      color: var(--brown);
    }

    /* Contents (→ members-only page) */
    .blk.contents {
      grid-area: contents;
      background: var(--navy);
      color: var(--cream);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .blk.contents h2 { font-size: 1.7rem; }

    .blk.contents p {
      margin-top: 8px;
      font-size: 0.78rem;
      opacity: 0.85;
    }

    /* Member */
    .blk.member {
      grid-area: member;
      background: var(--red);
      color: var(--cream);
    }

    .blk.member h2 { margin-bottom: 24px; }

    .member-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 26px 20px;
    }

    .member-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .m-num {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(239, 228, 204, 0.65);
    }

    .m-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--cream);
    }

    .m-bio {
      font-size: 0.8rem;
      line-height: 1.6;
      color: rgba(239, 228, 204, 0.82);
    }

    /* Footer */
    footer {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 32px 20px;
    }

    footer p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .mosaic {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "about members"
          "news contents"
          "member member";
      }
      .member-list { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      .hero-logo img { width: min(360px, 86vw); }

      .mosaic {
        grid-template-columns: 1fr;
        grid-template-areas:
          "about"
          "members"
          "news"
          "contents"
          "member";
      }

      .blk { padding: 28px; }
      .blk h2 { font-size: 1.7rem; }
      .member-list { grid-template-columns: repeat(2, 1fr); }

      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <header class="hero" id="hero">
    <div class="hero-logo" id="hero-logo">
      <img src="logo-white.png" alt="タコス倶楽部">
    </div>
  </header>

  <main>
    <div class="mosaic">
      <section id="about" class="blk about">
        <span class="tag">和 · ABOUT</span>
        <h2>About</h2>
        <p class="sec-desc">
          タコス好きによるタコス好きのためのゆるコミュニティ。<br>
          タコスに興味ある人も、最近気になっちゃってる人も、<br>
          本場のタコスを楽しみましょ！
        </p>
        <span class="kanji">和</span>
      </section>

      <a class="blk members" href="https://tacosclub.stores.jp/" target="_blank" rel="noopener">
        <span class="tag">入 · JOIN</span>
        <span class="jb-main">入会</span>
        <span class="jb-sub">タコス倶楽部に参加（STORES）</span>
        <span class="kanji">入</span>
      </a>

      <section id="news" class="blk news">
        <span class="tag">報 · NEWS</span>
        <h2>News</h2>
        <div id="news-list"></div>
        <span class="kanji">報</span>
      </section>

      <a id="contents" class="blk contents" href="contents.html">
        <span class="tag">秘 · CONTENTS</span>
        <h2>MEMBERS ONLY</h2>
        <p>会員限定コンテンツ</p>
        <span class="kanji">秘</span>
      </a>

      <section id="members" class="blk member">
        <span class="tag">衆 · MEMBER</span>
        <h2>Member</h2>
        <div class="member-list" id="member-grid"></div>
        <span class="kanji">衆</span>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
    <a href="edit.html" style="display:inline-block;margin-top:8px;color:#fff;opacity:0.5;font-size:0.75rem;text-decoration:none;">編集</a>
  </footer>

  <script>
    // Fade the hero logo out as the user scrolls
    const heroLogo = document.getElementById('hero-logo');
    function updateHero() {
      const fadeEnd = window.innerHeight * 0.6;
      const t = Math.min(window.scrollY / fadeEnd, 1);
      heroLogo.style.opacity = String(1 - t);
      heroLogo.style.transform = `translateY(${window.scrollY * 0.25}px)`;
    }
    window.addEventListener('scroll', updateHero, { passive: true });
    updateHero();

    async function loadAndRender() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const memberGrid = document.getElementById('member-grid');
      memberGrid.innerHTML = '';
      data.members.sort((a, b) => {
        const numA = parseInt(a.number || '999', 10);
        const numB = parseInt(b.number || '999', 10);
        return numA - numB;
      });
      data.members.forEach((m, i) => {
        const num = m.number || String(i + 1).padStart(2, '0');
        memberGrid.innerHTML += `
          <div class="member-row">
            <span class="m-num">No.${num}</span>
            <span class="m-name">${m.name}</span>
            <span class="m-bio">${m.bio}</span>
          </div>`;
      });

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = '';
      data.news.forEach(n => {
        newsList.innerHTML += `
          <div class="schedule-item">
            <span class="date">${n.date}</span>
            <span class="event">${n.event}</span>
          </div>`;
      });
    }
    loadAndRender();
  </script>
</body>
</html>
