<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #40210f;
      background: #fdf3e7;
    }

    /* Header */
    header {
      text-align: center;
      padding: 72px 20px 28px;
    }

    header h1 {
      font-family: 'Yellowtail', cursive;
      font-size: 5rem;
      font-weight: 400;
      line-height: 1.1;
      color: transparent;
      -webkit-text-stroke: 2px #fd6405;
      letter-spacing: 0.02em;
    }

    header p {
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #40210f;
      text-transform: uppercase;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 20px;
      background: #fdf3e7;
      border-bottom: 1.5px solid #40210f22;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: #40210f;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #fd6405;
    }

    /* Section cards */
    main {
      max-width: 960px;
      margin: 24px auto 64px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .sec-card {
      border: 1.5px solid #40210f;
      border-radius: 32px;
      padding: 32px;
      box-shadow: 0 2px 0 #40210f22;
    }

    .sec-card.tint-1 { background: #ffd9ac; }
    .sec-card.tint-2 { background: #ffe9c9; }
    .sec-card.tint-3 { background: #ff9d5c; }
    .sec-card.tint-4 { background: #fff3cd; }

    .sec-head {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      align-items: start;
    }

    .sec-photo {
      border-radius: 18px;
      border: 1.5px solid #40210f;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      background: linear-gradient(135deg, #fd6405 0%, #ffb066 100%);
      overflow: hidden;
    }

    .sec-title-area {
      min-width: 0;
    }

    .sec-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .sec-card h2 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .sec-desc {
      font-size: 0.92rem;
      line-height: 1.9;
    }

    .sec-body {
      margin-top: 28px;
    }

    /* Members */
    .member-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 28px 32px;
    }

    .member-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .member-avatar {
      width: 72px;
      height: 72px;
      min-height: 72px;
      border-radius: 50%;
      border: 1.5px solid #40210f;
      background: linear-gradient(135deg, #fd6405 0%, #ff9a44 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .member-avatar img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-number {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 2px;
    }

    .member-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .member-card p {
      font-size: 0.8rem;
      line-height: 1.7;
      opacity: 0.75;
    }

    .contents-link {
      text-align: center;
      margin-top: 36px;
    }

    .contents-link a {
      display: inline-block;
      background: #fd6405;
      color: #fff;
      text-decoration: none;
      border: 1.5px solid #40210f;
      padding: 18px 72px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.5;
      transition: transform 0.2s, background 0.2s;
    }

    .contents-link a:hover {
      background: #e55a04;
      transform: translateY(-2px);
    }

    .contents-link a span {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: none;
      opacity: 0.9;
    }

    /* News */
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #40210f33;
    }

    .schedule-item:last-child {
      border-bottom: none;
    }

    .schedule-item .date {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 110px;
    }

    .schedule-item .event {
      font-size: 0.92rem;
    }

    /* Contact links */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
    }

    .link-item {
      display: block;
      background: #fff;
      color: #40210f;
      text-decoration: none;
      padding: 15px 24px;
      border-radius: 14px;
      border: 1.5px solid #40210f;
      font-size: 0.92rem;
      font-weight: 700;
      transition: background 0.2s, transform 0.2s;
    }

    .link-item:hover {
      background: #ffe9c9;
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      background: #fd6405;
      color: #fff;
      text-align: center;
      padding: 32px 20px;
    }

    footer p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    /* Responsive */
    @media (max-width: 700px) {
      header { padding: 48px 16px 20px; }
      header h1 { font-size: 3.2rem; -webkit-text-stroke-width: 1.5px; }

      nav { gap: 16px; flex-wrap: wrap; }

      .sec-card { padding: 22px; border-radius: 24px; }

      .sec-head {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .sec-photo { aspect-ratio: 16 / 9; font-size: 56px; }
      .sec-card h2 { font-size: 1.8rem; }

      .member-grid { grid-template-columns: 1fr; }

      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tacos Club</h1>
    <p>タコス倶楽部</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#members">Member</a>
    <a href="contents.html">Contents</a>
    <a href="#news">News</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="about" class="sec-card tint-1">
      <div class="sec-head">
        <div class="sec-photo">🌮</div>
        <div class="sec-title-area">
          <span class="sec-label">Section 1</span>
          <h2>About</h2>
          <p class="sec-desc">
            タコス好きによるタコス好きのためのゆるコミュニティ。<br>
            タコスに興味ある人も、最近気になっちゃってる人も、<br>
            本場のタコスを楽しみましょ！
          </p>
        </div>
      </div>
    </section>

    <section id="members" class="sec-card tint-2">
      <div class="sec-head">
        <div class="sec-photo">🫂</div>
        <div class="sec-title-area">
          <span class="sec-label">Section 2</span>
          <h2>Member</h2>
          <p class="sec-desc">タコス倶楽部の愉快なメンバーたち。</p>
        </div>
      </div>
      <div class="sec-body">
        <div class="member-grid" id="member-grid"></div>
        <div class="contents-link">
          <a href="contents.html">Contents<span>(members only)</span></a>
        </div>
      </div>
    </section>

    <section id="news" class="sec-card tint-3">
      <div class="sec-head">
        <div class="sec-photo">📰</div>
        <div class="sec-title-area">
          <span class="sec-label">Section 3</span>
          <h2>News</h2>
          <div id="news-list"></div>
        </div>
      </div>
    </section>

    <section id="contact" class="sec-card tint-4">
      <div class="sec-head">
        <div class="sec-photo">💌</div>
        <div class="sec-title-area">
          <span class="sec-label">Section 4</span>
          <h2>Contact</h2>
          <div class="link-list" id="link-list"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
    <a href="edit.html" style="display:inline-block;margin-top:8px;color:#fff;opacity:0.5;font-size:0.75rem;text-decoration:none;">編集</a>
  </footer>

  <script>
    async function loadAndRender() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const memberGrid = document.getElementById('member-grid');
      memberGrid.innerHTML = '';
      data.members.sort((a, b) => {
        const numA = parseInt(a.number || '999', 10);
        const numB = parseInt(b.number || '999', 10);
        return numA - numB;
      });
      data.members.forEach((m, i) => {
        const num = m.number || String(i + 1).padStart(2, '0');
        const avatarContent = m.image
          ? `<img src="${m.image}" alt="${m.name}">`
          : m.emoji;
        memberGrid.innerHTML += `
          <div class="member-card">
            <div class="member-avatar">${avatarContent}</div>
            <div class="member-info">
              <div class="member-number">No.${num}</div>
              <h3>${m.name}</h3>
              <p>${m.bio}</p>
            </div>
          </div>`;
      });

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = '';
      data.news.forEach(n => {
        newsList.innerHTML += `
          <div class="schedule-item">
            <span class="date">${n.date}</span>
            <span class="event">${n.event}</span>
          </div>`;
      });

      const linkList = document.getElementById('link-list');
      linkList.innerHTML = '';
      (data.links || []).forEach(l => {
        if (!l.url) return;
        const isExternal = /^https?:\/\//.test(l.url);
        const target = isExternal ? ' target="_blank" rel="noopener"' : '';
        linkList.innerHTML += `<a class="link-item" href="${l.url}"${target}>${l.label || l.url}</a>`;
      });
    }
    loadAndRender();
  </script>
</body>
</html>
