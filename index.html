<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:  #f7f0e4;
      --orange: #e8552b;
      --ink:    #111;
      --shadow: 5px 5px 0 var(--ink);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Montserrat', "游ゴシック体", YuGothic, "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    /* Nav */
    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 18px 24px;
      background: var(--cream);
      border-bottom: 3px solid var(--ink);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: var(--ink);
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--orange); }

    .nav-cta {
      background: var(--orange);
      color: #fff !important;
      border: 3px solid var(--ink);
      border-radius: 50px;
      padding: 11px 26px;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .nav-cta:hover {
      color: #fff !important;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* Hero */
    .hero {
      background: var(--orange);
      border-bottom: 3px solid var(--ink);
      text-align: center;
      padding: 68px 20px 60px;
    }

    .hero img {
      width: min(280px, 68vw);
      height: auto;
      display: block;
      margin: 0 auto 26px;
    }

    .badge {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      border-radius: 50px;
      padding: 10px 26px;
      font-weight: 800;
      font-size: 0.76rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Layout */
    main {
      max-width: 980px;
      margin: 54px auto 72px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    .block {
      border: 3px solid var(--ink);
      border-radius: 26px;
      padding: 38px 36px;
      box-shadow: var(--shadow);
    }

    .block.cream  { background: #fff; }
    .block.orange { background: var(--orange); color: #fff; }

    .block h2 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.1;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .lead {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 2;
    }

    /* Members */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 26px;
      margin-top: 26px;
    }

    .member-card {
      border-top: 3px solid var(--ink);
      padding-top: 12px;
    }

    .member-number {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--orange);
      margin-bottom: 3px;
    }

    .member-card h3 {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .member-card p {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.7;
      opacity: 0.8;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 34px;
    }

    .btn {
      display: inline-block;
      border: 3px solid var(--ink);
      border-radius: 50px;
      padding: 15px 44px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:hover {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .btn-orange { background: var(--orange); color: #fff; }
    .btn-white  { background: #fff; color: var(--ink); }

    /* News */
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 2px solid rgba(255, 255, 255, 0.45);
    }

    .schedule-item:last-child { border-bottom: none; }

    .schedule-item .date {
      font-weight: 900;
      font-size: 0.92rem;
      min-width: 108px;
    }

    .schedule-item .event {
      font-size: 0.92rem;
      font-weight: 700;
    }

    /* Footer */
    footer {
      background: var(--ink);
      color: var(--cream);
      text-align: center;
      padding: 34px 20px;
    }

    footer p {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .member-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      nav { gap: 16px; flex-wrap: wrap; padding: 14px 16px; }
      nav a { font-size: 0.8rem; }
      .nav-cta { padding: 9px 20px; }

      .hero { padding: 46px 18px 40px; }
      .block { padding: 26px 22px; border-radius: 20px; }
      .block h2 { font-size: 1.7rem; }

      .member-grid { grid-template-columns: repeat(2, 1fr); }

      .btn { padding: 14px 32px; font-size: 0.92rem; }

      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#about">About</a>
    <a href="#members">Member</a>
    <a href="contents.html">Contents</a>
    <a href="#news">News</a>
    <a class="nav-cta" href="https://tacosclub.stores.jp/" target="_blank" rel="noopener">参加する</a>
  </nav>

  <header class="hero">
    <img src="logo-white.png" alt="タコス倶楽部">
    <span class="badge">Tacos Club Japan &nbsp;·&nbsp; Community</span>
  </header>

  <main>
    <section id="about" class="block cream">
      <h2>About</h2>
      <p class="lead">
        タコス好きによるタコス好きのためのゆるコミュニティ。<br>
        タコスに興味ある人も、最近気になっちゃってる人も、<br>
        本場のタコスを楽しみましょ！
      </p>
    </section>

    <section id="members" class="block cream">
      <h2>Member</h2>
      <p class="lead">タコス倶楽部の愉快なメンバーたち。</p>
      <div class="member-grid" id="member-grid"></div>
      <div class="btn-row">
        <a class="btn btn-orange" href="https://tacosclub.stores.jp/" target="_blank" rel="noopener">入会</a>
        <a class="btn btn-white" href="contents.html">Members Only</a>
      </div>
    </section>

    <section id="news" class="block orange">
      <h2>News</h2>
      <div id="news-list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
  </footer>

  <script>
    async function loadAndRender() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const memberGrid = document.getElementById('member-grid');
      memberGrid.innerHTML = '';
      data.members.sort((a, b) => {
        const numA = parseInt(a.number || '999', 10);
        const numB = parseInt(b.number || '999', 10);
        return numA - numB;
      });
      data.members.forEach((m, i) => {
        const num = m.number || String(i + 1).padStart(2, '0');
        memberGrid.innerHTML += `
          <div class="member-card">
            <div class="member-number">No.${num}</div>
            <h3>${m.name}</h3>
            <p>${m.bio}</p>
          </div>`;
      });

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = '';
      data.news.forEach(n => {
        newsList.innerHTML += `
          <div class="schedule-item">
            <span class="date">${n.date}</span>
            <span class="event">${n.event}</span>
          </div>`;
      });
    }
    loadAndRender();
  </script>
</body>
</html>
