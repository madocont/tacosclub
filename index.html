<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #fff;
      background: #14100c;
    }

    /* Fixed photo background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url('hero.jpg') center / cover no-repeat, #14100c;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    /* Hero: full-screen white logo */
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero-logo img {
      width: min(420px, 80vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.5));
    }

    /* Layout */
    main {
      max-width: 960px;
      margin: 64px auto 96px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .sec-card {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.45);
    }

    .sec-card h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: #fff;
    }

    .sec-desc {
      font-size: 0.94rem;
      line-height: 2;
      color: #fff;
    }

    /* About — plain, centered on background */
    .about {
      text-align: center;
      padding: 24px 20px 8px;
    }

    .about h2 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* News + Contents side by side */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: stretch;
    }

    .two-col > * { margin: 0; }

    /* News */
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    }

    .schedule-item:last-child { border-bottom: none; }

    .schedule-item .date {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 100px;
      color: #fff;
    }

    .schedule-item .event {
      font-size: 0.92rem;
      color: #fff;
    }

    /* Right column: join button on top, contents banner below */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Join button (→ STORES) */
    .join-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      background: #fff;
      color: #fa5514;
      border-radius: 28px;
      padding: 24px;
      transition: background 0.2s, transform 0.2s;
    }

    .join-btn:hover {
      background: #fff3eb;
      transform: translateY(-2px);
    }

    .join-btn .jb-main {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .join-btn .jb-sub {
      margin-top: 6px;
      font-size: 0.76rem;
      font-weight: 500;
      opacity: 0.8;
    }

    /* Contents banner (orange) — half height */
    .contents-banner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      background: #fa5514;
      border: none;
      border-radius: 28px;
      padding: 28px;
      color: #fff;
      transition: background 0.2s, transform 0.2s;
    }

    .contents-banner:hover {
      background: #e14710;
      transform: translateY(-2px);
    }

    .contents-banner h2 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .contents-banner p {
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.85;
    }

    /* Member — 5-column grid: No. / name / bio stacked per cell */
    .member-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 28px 20px;
    }

    .member-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .m-num {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.7);
    }

    .m-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
    }

    .m-bio {
      font-size: 0.8rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }

    /* Contact links */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
    }

    .link-item {
      display: block;
      background: transparent;
      color: #fff;
      text-decoration: none;
      padding: 15px 24px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      font-size: 0.92rem;
      font-weight: 700;
      transition: background 0.2s, color 0.2s;
    }

    .link-item:hover {
      background: #fff;
      color: #14100c;
    }

    /* Footer */
    footer {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 32px 20px;
    }

    footer p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .member-list { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      .hero-logo img { width: min(320px, 84vw); }

      .sec-card { padding: 26px 22px; border-radius: 22px; }
      .sec-card h2 { font-size: 1.7rem; }

      .about h2 { font-size: 2rem; }

      .two-col { grid-template-columns: 1fr; }

      .member-list { grid-template-columns: repeat(2, 1fr); }

      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <header class="hero" id="hero">
    <div class="hero-logo" id="hero-logo">
      <img src="logo-white.png" alt="タコス倶楽部">
    </div>
  </header>

  <main>
    <section id="about" class="about">
      <h2>About</h2>
      <p class="sec-desc">
        タコス好きによるタコス好きのためのゆるコミュニティ。<br>
        タコスに興味ある人も、最近気になっちゃってる人も、<br>
        本場のタコスを楽しみましょ！
      </p>
    </section>

    <div class="two-col">
      <section id="news" class="sec-card">
        <h2>News</h2>
        <div id="news-list"></div>
      </section>

      <div class="right-col">
        <a class="join-btn" href="https://tacosclub.stores.jp/" target="_blank" rel="noopener">
          <span class="jb-main">入会</span>
        </a>
        <a id="contents" class="contents-banner" href="contents.html">
          <h2>MEMBERS ONLY</h2>
        </a>
      </div>
    </div>

    <section id="members" class="sec-card">
      <h2>Member</h2>
      <div class="member-list" id="member-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
  </footer>

  <script>
    // Fade the hero logo out as the user scrolls
    const heroLogo = document.getElementById('hero-logo');
    function updateHero() {
      const fadeEnd = window.innerHeight * 0.6;
      const t = Math.min(window.scrollY / fadeEnd, 1);
      heroLogo.style.opacity = String(1 - t);
      heroLogo.style.transform = `translateY(${window.scrollY * 0.25}px)`;
    }
    window.addEventListener('scroll', updateHero, { passive: true });
    updateHero();

    async function loadAndRender() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const memberGrid = document.getElementById('member-grid');
      memberGrid.innerHTML = '';
      data.members.sort((a, b) => {
        const numA = parseInt(a.number || '999', 10);
        const numB = parseInt(b.number || '999', 10);
        return numA - numB;
      });
      data.members.forEach((m, i) => {
        const num = m.number || String(i + 1).padStart(2, '0');
        memberGrid.innerHTML += `
          <div class="member-row">
            <span class="m-num">No.${num}</span>
            <span class="m-name">${m.name}</span>
            <span class="m-bio">${m.bio}</span>
          </div>`;
      });

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = '';
      data.news.forEach(n => {
        newsList.innerHTML += `
          <div class="schedule-item">
            <span class="date">${n.date}</span>
            <span class="event">${n.event}</span>
          </div>`;
      });
    }
    loadAndRender();
  </script>
</body>
</html>
