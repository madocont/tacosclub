<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #fff;
      background: #14100c;
    }

    /* Fixed photo background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url('hero.jpg') center / cover no-repeat, #14100c;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    /* Hero: full-screen white logo */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero-logo img {
      width: min(300px, 62vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.45));
    }

    .hero-scroll {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: rgba(255, 255, 255, 0.8);
      animation: bob 2s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.75);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    nav a:hover { opacity: 0.6; }

    /* Section cards */
    main {
      max-width: 960px;
      margin: 48px auto 96px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .sec-card {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.45);
    }

    .sec-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.75);
    }

    .sec-card h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: #fff;
    }

    .sec-desc {
      font-size: 0.94rem;
      line-height: 2;
      color: #fff;
    }

    .sec-body { margin-top: 28px; }

    /* Members */
    .member-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 28px 32px;
    }

    .member-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .member-avatar {
      width: 68px;
      height: 68px;
      min-height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: linear-gradient(135deg, #fd6405 0%, #ff9a44 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .member-avatar img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-number {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      margin-bottom: 2px;
      color: rgba(255, 255, 255, 0.7);
    }

    .member-card h3 {
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .member-card p {
      font-size: 0.8rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
    }

    .contents-link {
      text-align: center;
      margin-top: 40px;
    }

    .contents-link a {
      display: inline-block;
      background: transparent;
      color: #fff;
      text-decoration: none;
      border: 1.5px solid #fff;
      padding: 16px 64px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.5;
      transition: background 0.2s, color 0.2s;
    }

    .contents-link a:hover {
      background: #fff;
      color: #14100c;
    }

    .contents-link a span {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: none;
      opacity: 0.85;
    }

    /* News */
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    }

    .schedule-item:last-child { border-bottom: none; }

    .schedule-item .date {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 110px;
      color: #fff;
    }

    .schedule-item .event {
      font-size: 0.92rem;
      color: #fff;
    }

    /* Contact links */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
    }

    .link-item {
      display: block;
      background: transparent;
      color: #fff;
      text-decoration: none;
      padding: 15px 24px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      font-size: 0.92rem;
      font-weight: 700;
      transition: background 0.2s, color 0.2s;
    }

    .link-item:hover {
      background: #fff;
      color: #14100c;
    }

    /* Footer */
    footer {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 32px 20px;
    }

    footer p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .hero-logo img { width: min(230px, 66vw); }

      nav { gap: 16px; flex-wrap: wrap; }

      .sec-card { padding: 26px 22px; border-radius: 22px; }
      .sec-card h2 { font-size: 1.7rem; }

      .member-grid { grid-template-columns: 1fr; }

      .schedule-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <header class="hero" id="hero">
    <div class="hero-logo" id="hero-logo">
      <img src="icon.png" alt="タコス倶楽部">
    </div>
    <div class="hero-scroll">SCROLL</div>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#members">Member</a>
    <a href="contents.html">Contents</a>
    <a href="#news">News</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="about" class="sec-card">
      <span class="sec-label">Section 1</span>
      <h2>About</h2>
      <p class="sec-desc">
        タコス好きによるタコス好きのためのゆるコミュニティ。<br>
        タコスに興味ある人も、最近気になっちゃってる人も、<br>
        本場のタコスを楽しみましょ！
      </p>
    </section>

    <section id="members" class="sec-card">
      <span class="sec-label">Section 2</span>
      <h2>Member</h2>
      <p class="sec-desc">タコス倶楽部の愉快なメンバーたち。</p>
      <div class="sec-body">
        <div class="member-grid" id="member-grid"></div>
        <div class="contents-link">
          <a href="contents.html">Contents<span>(members only)</span></a>
        </div>
      </div>
    </section>

    <section id="news" class="sec-card">
      <span class="sec-label">Section 3</span>
      <h2>News</h2>
      <div id="news-list"></div>
    </section>

    <section id="contact" class="sec-card">
      <span class="sec-label">Section 4</span>
      <h2>Contact</h2>
      <div class="link-list" id="link-list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 タコス倶楽部 All Rights Reserved.</p>
    <a href="edit.html" style="display:inline-block;margin-top:8px;color:#fff;opacity:0.5;font-size:0.75rem;text-decoration:none;">編集</a>
  </footer>

  <script>
    // Fade the hero logo out as the user scrolls
    const heroLogo = document.getElementById('hero-logo');
    function updateHero() {
      const fadeEnd = window.innerHeight * 0.6;
      const t = Math.min(window.scrollY / fadeEnd, 1);
      heroLogo.style.opacity = String(1 - t);
      heroLogo.style.transform = `translateY(${window.scrollY * 0.25}px)`;
    }
    window.addEventListener('scroll', updateHero, { passive: true });
    updateHero();

    async function loadAndRender() {
      const res = await fetch('data.json?t=' + Date.now());
      const data = await res.json();

      const memberGrid = document.getElementById('member-grid');
      memberGrid.innerHTML = '';
      data.members.sort((a, b) => {
        const numA = parseInt(a.number || '999', 10);
        const numB = parseInt(b.number || '999', 10);
        return numA - numB;
      });
      data.members.forEach((m, i) => {
        const num = m.number || String(i + 1).padStart(2, '0');
        const avatarContent = m.image
          ? `<img src="${m.image}" alt="${m.name}">`
          : m.emoji;
        memberGrid.innerHTML += `
          <div class="member-card">
            <div class="member-avatar">${avatarContent}</div>
            <div class="member-info">
              <div class="member-number">No.${num}</div>
              <h3>${m.name}</h3>
              <p>${m.bio}</p>
            </div>
          </div>`;
      });

      const newsList = document.getElementById('news-list');
      newsList.innerHTML = '';
      data.news.forEach(n => {
        newsList.innerHTML += `
          <div class="schedule-item">
            <span class="date">${n.date}</span>
            <span class="event">${n.event}</span>
          </div>`;
      });

      const linkList = document.getElementById('link-list');
      linkList.innerHTML = '';
      (data.links || []).forEach(l => {
        if (!l.url) return;
        const isExternal = /^https?:\/\//.test(l.url);
        const target = isExternal ? ' target="_blank" rel="noopener"' : '';
        linkList.innerHTML += `<a class="link-item" href="${l.url}"${target}>${l.label || l.url}</a>`;
      });
    }
    loadAndRender();
  </script>
</body>
</html>
