<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contents - タコス倶楽部</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --terra: #e8552b;
      --brown: #111;
      --ink:   #111;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', "游ゴシック体", YuGothic, "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      color: var(--brown);
      background: var(--terra);
      min-height: 100vh;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .top-back {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }

    .top-back:hover { opacity: 1; }

    .detail-card {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 30px;
      padding: 44px 40px;
      box-shadow: 6px 6px 0 var(--ink);
    }

    .detail-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .detail-content {
      font-size: 1rem;
      line-height: 2;
      color: #333;
      white-space: pre-wrap;
    }

    .detail-back-wrap {
      text-align: center;
      margin-top: 40px;
    }

    .detail-back-btn {
      display: inline-block;
      padding: 13px 40px;
      background: #fff;
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 50px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .detail-back-btn:hover { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--ink); }

    @media (max-width: 600px) {
      .detail-card { padding: 32px 24px; border-radius: 22px; }
      .detail-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <a href="contents.html" class="top-back">← Back</a>
    <div class="detail-card" id="detail-body">
      <p>読み込み中...</p>
    </div>
  </div>

  <script>
    async function loadDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = Number(params.get('id'));

      const res = await fetch('data.json');
      const data = await res.json();

      const item = (data.contents || []).find(c => c.id === id);
      const body = document.getElementById('detail-body');

      if (!item) {
        body.innerHTML = '<p>コンテンツが見つかりませんでした。</p>';
        return;
      }

      document.title = `${item.title} - タコス倶楽部`;

      const backHref = item.category
        ? `contents.html?cat=${encodeURIComponent(item.category)}`
        : 'contents.html';
      body.innerHTML = `
        <h2 class="detail-title">${item.title}</h2>
        <div class="detail-content">${item.body || ''}</div>
        <div class="detail-back-wrap">
          <a href="${backHref}" class="detail-back-btn">← 戻る</a>
        </div>
      `;
    }

    loadDetail();
  </script>
</body>
</html>
